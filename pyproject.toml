[project]
name = "deterministic-parser-training-dataset-synthesizer"
version = "0.1.0"
description = "Deterministic evidence-grounded parser training dataset synthesizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "sqlglot>=30.18.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-python>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dataset_tools"


[tool.pytest.ini_options]
pythonpath = [
    ".",
]
